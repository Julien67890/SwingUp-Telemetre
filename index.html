<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesure de distance par caméra</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    .container {
      background: #16213e;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      max-width: 800px;
      width: 100%;
      position: relative;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f0f1f;
      border-radius: 12px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      pointer-events: auto; /* pour capturer les clics */
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      justify-content: center;
    }
    .controls input {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #2a2a4a;
      color: white;
      width: 100px;
      font-size: 14px;
      text-align: center;
    }
    .controls input::placeholder {
      color: #8888aa;
    }
    .controls button {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      background: #e94560;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }
    .controls button:hover {
      background: #c73652;
      transform: scale(1.03);
    }
    .controls button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .controls button.secondary {
      background: #533483;
    }
    .controls button.secondary:hover {
      background: #6a4a9a;
    }
    .info {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f0f1f;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .info .status {
      color: #aaa;
    }
    .info .distance {
      font-size: 22px;
      font-weight: bold;
      color: #4fc3f7;
      min-width: 100px;
      text-align: right;
    }
    .info .distance .unit {
      font-size: 16px;
      font-weight: normal;
      color: #888;
    }
    .info .selected {
      color: #ffd54f;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .controls input { width: 80px; }
      .controls button { font-size: 12px; padding: 6px 12px; }
      .info { font-size: 14px; }
      .info .distance { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="video-wrapper">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <input id="heightInput" type="number" step="0.01" placeholder="Hauteur (m)" />
    <input id="distInput" type="number" step="0.01" placeholder="Distance (m)" />
    <button id="calibrateBtn" class="secondary" disabled>📏 Calibrer</button>
    <button id="resetBtn" class="secondary">🔄 Réinitialiser</button>
    <button id="measureBtn">▶ Mesurer</button>
  </div>

  <div class="info">
    <span class="status" id="status">📷 Attente de la caméra…</span>
    <span class="selected" id="selectedInfo">Aucun objet sélectionné</span>
    <span class="distance" id="distanceDisplay">— <span class="unit">m</span></span>
  </div>
</div>

<!-- TensorFlow.js et COCO-SSD depuis CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

<script>
  (function() {
    // --- Éléments DOM ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const heightInput = document.getElementById('heightInput');
    const distInput = document.getElementById('distInput');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const measureBtn = document.getElementById('measureBtn');
    const statusEl = document.getElementById('status');
    const selectedInfo = document.getElementById('selectedInfo');
    const distanceDisplay = document.getElementById('distanceDisplay');

    // --- État de l'application ---
    let model = null;
    let isMeasuring = false;
    let isCalibrated = false;
    let calibrationFactor = null; // K = hauteur_pixels * distance_actuelle
    let selectedBox = null;       // { x, y, width, height, class }
    let lastKnownBox = null;      // pour suivre l'objet
    let frameId = null;
    let detectionInterval = null;

    // Paramètres de performance
    const DETECTION_INTERVAL_MS = 150; // détecter toutes les 150ms pour fluidité
    const CONFIDENCE_THRESHOLD = 0.5;

    // --- Initialisation de la caméra ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await video.play();
        // Adapter la taille du canvas
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        statusEl.textContent = '📸 Caméra prête, chargement du modèle…';
        return true;
      } catch (err) {
        statusEl.textContent = '❌ Erreur caméra : ' + err.message;
        return false;
      }
    }

    // --- Chargement du modèle COCO-SSD ---
    async function loadModel() {
      try {
        model = await cocoSsd.load({ base: 'mobilenet_v2' });
        statusEl.textContent = '✅ Modèle chargé – cliquez sur un objet dans l’image';
        return true;
      } catch (err) {
        statusEl.textContent = '❌ Erreur modèle : ' + err.message;
        return false;
      }
    }

    // --- Détection des objets sur une image ---
    async function detectObjects() {
      if (!model || video.readyState < 2) return [];
      try {
        const predictions = await model.detect(video);
        return predictions.filter(p => p.score >= CONFIDENCE_THRESHOLD);
      } catch (e) {
        console.warn('Erreur détection:', e);
        return [];
      }
    }

    // --- Dessiner les boîtes et l'interface ---
    function drawOverlay(detections, selected) {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Dessiner toutes les détections
      detections.forEach(d => {
        const [x, y, width, height] = d.bbox;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, width, height);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '14px sans-serif';
        ctx.fillText(`${d.class} (${Math.round(d.score*100)}%)`, x, y - 6);
      });

      // Mettre en avant la boîte sélectionnée
      if (selected) {
        const { x, y, width, height } = selected;
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ffd54f';
        ctx.shadowBlur = 12;
        ctx.strokeRect(x, y, width, height);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('🎯 ' + (selected.class || 'Objet'), x, y - 12);
      }
    }

    // --- Trouver l'objet cliqué ---
    function getObjectAtClick(e, detections) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      // Chercher la boîte contenant le point (on prend la plus petite surface pour précision)
      let best = null;
      let bestArea = Infinity;
      for (const d of detections) {
        const [x, y, w, h] = d.bbox;
        if (mx >= x && mx <= x + w && my >= y && my <= y + h) {
          const area = w * h;
          if (area < bestArea) {
            bestArea = area;
            best = { x, y, width: w, height: h, class: d.class };
          }
        }
      }
      return best;
    }

    // --- Suivi : trouver la détection la plus proche de la boîte précédente ---
    function findClosestDetection(detections, prevBox) {
      if (!prevBox) return null;
      let best = null;
      let bestIoU = 0;
      for (const d of detections) {
        const [x, y, w, h] = d.bbox;
        const iou = computeIoU({ x, y, width: w, height: h }, prevBox);
        if (iou > bestIoU) {
          bestIoU = iou;
          best = { x, y, width: w, height: h, class: d.class };
        }
      }
      // Seuil d'IoU pour éviter les sauts
      return (bestIoU > 0.3) ? best : null;
    }

    function computeIoU(a, b) {
      const ax = a.x, ay = a.y, aw = a.width, ah = a.height;
      const bx = b.x, by = b.y, bw = b.width, bh = b.height;
      const x1 = Math.max(ax, bx), y1 = Math.max(ay, by);
      const x2 = Math.min(ax + aw, bx + bw), y2 = Math.min(ay + ah, by + bh);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const areaA = aw * ah, areaB = bw * bh;
      return inter / (areaA + areaB - inter + 1e-6);
    }

    // --- Boucle de mesure ---
    async function measureLoop() {
      if (!isMeasuring) return;

      const detections = await detectObjects();
      if (detections.length === 0) {
        statusEl.textContent = '⚠️ Aucun objet détecté';
        drawOverlay([], selectedBox);
        requestAnimationFrame(measureLoop);
        return;
      }

      // Si on a un objet sélectionné, on le suit
      let currentBox = null;
      if (selectedBox) {
        // Chercher la détection la plus proche
        currentBox = findClosestDetection(detections, lastKnownBox || selectedBox);
        if (currentBox) {
          // Mise à jour
          lastKnownBox = { ...currentBox };
        } else {
          // Perte de suivi : on garde l'ancienne boîte mais on affiche un avertissement
          currentBox = lastKnownBox || selectedBox;
          statusEl.textContent = '⚠️ Suivi perdu, utilisation de la dernière position';
        }
      } else {
        // Pas d'objet sélectionné : on affiche juste les détections
        drawOverlay(detections, null);
        requestAnimationFrame(measureLoop);
        return;
      }

      // Calcul de la distance si calibré
      if (isCalibrated && currentBox) {
        const heightPx = currentBox.height;
        if (heightPx > 0) {
          const distance = calibrationFactor / heightPx;
          distanceDisplay.textContent = distance.toFixed(2) + ' m';
        } else {
          distanceDisplay.textContent = '— m';
        }
        selectedInfo.textContent = `📌 ${currentBox.class || 'Objet'} suivi`;
        statusEl.textContent = '📏 Mesure en cours';
      } else if (!isCalibrated) {
        statusEl.textContent = '🔧 Calibrez d’abord (hauteur et distance)';
        distanceDisplay.textContent = '— m';
      }

      // Dessiner
      drawOverlay(detections, currentBox);
      requestAnimationFrame(measureLoop);
    }

    // --- Lancer / arrêter la mesure ---
    function startMeasurement() {
      if (isMeasuring) return;
      if (!selectedBox) {
        statusEl.textContent = '⚠️ Veuillez d’abord cliquer sur un objet';
        return;
      }
      if (!isCalibrated) {
        statusEl.textContent = '⚠️ Veuillez calibrer (hauteur + distance)';
        return;
      }
      isMeasuring = true;
      measureBtn.textContent = '⏹ Arrêter';
      measureBtn.classList.add('secondary');
      statusEl.textContent = '📏 Mesure en cours…';
      lastKnownBox = { ...selectedBox };
      measureLoop();
    }

    function stopMeasurement() {
      isMeasuring = false;
      measureBtn.textContent = '▶ Mesurer';
      measureBtn.classList.remove('secondary');
      statusEl.textContent = isCalibrated ? '✅ Calibré, prêt à mesurer' : '🔧 En attente de calibration';
      if (frameId) {
        cancelAnimationFrame(frameId);
        frameId = null;
      }
    }

    function toggleMeasurement() {
      if (isMeasuring) {
        stopMeasurement();
      } else {
        startMeasurement();
      }
    }

    // --- Calibration ---
    function calibrate() {
      const h = parseFloat(heightInput.value);
      const d = parseFloat(distInput.value);
      if (!selectedBox) {
        statusEl.textContent = '❌ Sélectionnez d’abord un objet (cliquez dessus)';
        return;
      }
      if (!h || h <= 0 || !d || d <= 0) {
        statusEl.textContent = '❌ Entrez une hauteur et une distance valides ( > 0)';
        return;
      }
      // Le facteur K = hauteur_pixels * distance
      calibrationFactor = selectedBox.height * d;
      isCalibrated = true;
      calibrateBtn.disabled = true;
      statusEl.textContent = `✅ Calibré (K = ${calibrationFactor.toFixed(1)}) – Lancez la mesure`;
      selectedInfo.textContent = `📌 ${selectedBox.class || 'Objet'} calibré (H=${h}m, D0=${d}m)`;
      // Mettre à jour distance affichée
      distanceDisplay.textContent = d.toFixed(2) + ' m (calibration)';
    }

    // --- Réinitialisation ---
    function resetAll() {
      stopMeasurement();
      selectedBox = null;
      lastKnownBox = null;
      isCalibrated = false;
      calibrationFactor = null;
      calibrateBtn.disabled = true;
      heightInput.value = '';
      distInput.value = '';
      distanceDisplay.textContent = '— m';
      selectedInfo.textContent = 'Aucun objet sélectionné';
      statusEl.textContent = '🔄 Réinitialisé – cliquez sur un objet';
      drawOverlay([], null);
    }

    // --- Gestion du clic sur le canvas ---
    async function onCanvasClick(e) {
      if (isMeasuring) return; // ne pas changer de sélection pendant la mesure

      const detections = await detectObjects();
      if (detections.length === 0) {
        statusEl.textContent = '⚠️ Aucun objet détecté, réessayez';
        return;
      }
      const clicked = getObjectAtClick(e, detections);
      if (clicked) {
        selectedBox = clicked;
        lastKnownBox = { ...clicked };
        calibrateBtn.disabled = false;
        selectedInfo.textContent = `🎯 ${clicked.class || 'Objet'} sélectionné (${Math.round(clicked.width)}×${Math.round(clicked.height)} px)`;
        statusEl.textContent = '🔧 Entrez hauteur et distance, puis Calibrer';
        drawOverlay(detections, clicked);
      } else {
        statusEl.textContent = '❌ Cliquez exactement sur un objet détecté';
      }
    }

    // --- Initialisation complète ---
    async function init() {
      const camOk = await initCamera();
      if (!camOk) return;
      const modelOk = await loadModel();
      if (!modelOk) return;

      // Écouteurs
      canvas.addEventListener('click', onCanvasClick);
      calibrateBtn.addEventListener('click', calibrate);
      resetBtn.addEventListener('click', resetAll);
      measureBtn.addEventListener('click', toggleMeasurement);

      // Lancer une boucle de dessin pour l'affichage des détections en attente
      function idleDraw() {
        if (!isMeasuring) {
          // On met à jour les détections pour affichage
          detectObjects().then(dets => {
            drawOverlay(dets, selectedBox);
            if (dets.length === 0 && !selectedBox) {
              statusEl.textContent = '👀 Aucun objet – placez un objet devant la caméra';
            }
          }).catch(() => {});
        }
        requestAnimationFrame(idleDraw);
      }
      idleDraw();

      statusEl.textContent = '✅ Prêt – cliquez sur un objet pour le sélectionner';
    }

    // Lancer au chargement
    init();
  })();
</script>
</body>
</html>
